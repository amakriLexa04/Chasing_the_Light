#textdomain wesnoth-ctl
[unit_type]
    id=Wesfolk Reaper Prototype
    name= _ "Wesfolk Reaper Prototype"
    race=human
    image="units/wesfolk/faction/wesfolk-reaper-aura-2.png"
    hitpoints=46
    movement_type=smallfoot
    movement=6
    experience=100
    level=2
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=35
    usage=fighter
    description= _ "Not every Wesfolk Fighter is content to hold a line in battle. Particularly zealous individuals have been seen to cast down their shields and wield their whip in both hands, inflicting horrid casualties but suffering grievous wounds. Those who survive are rewarded — cursed, some would say — by the Lich-Lords, and gifted a weapon said to harvest the soul of its victims. The magic of this scythe fades when removed from its owner, to the dismay of many a curious armorer."
    die_sound={SOUND_LIST:HUMAN_DIE}
    [abilities]
        {ABILITY_FEEDING}
    [/abilities]
    {DEFENSE_ANIM  "units/wesfolk/faction/wesfolk-reaper-aura-2.png" "units/wesfolk/faction/wesfolk-reaper-aura-4.png" {SOUND_LIST:HUMAN_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="units/wesfolk/faction/wesfolk-reaper-aura-[1~6].png:300"
        [/frame]
    [/standing_anim]

    [attack]
        name=scythe
        description=_"scythe"
        icon=attacks/scythe.png
        type=cold
        range=melee
        damage=10
        number=3
    [/attack]

    [attack]
        name=whip
        description=_"whip"
        icon=attacks/whip.png
        type=blade
        range=melee
        damage=7
        number=4
    [/attack]

    [attack_anim]
        [filter_attack]
            name=scythe
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/wesfolk/faction/wesfolk-reaper-aura-[3,4,4].png:[100,150,100]"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=whip
        [/filter_attack]
        offset=0.0~0.2,0.2~0.6,0.6~0.4,0.4~0.0
        start_time=-300
        [frame]
            image="units/wesfolk/faction/wesfolk-reaper-aura-2.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]
