#textdomain wesnoth-ctl
[unit_type]
    id=Wesfolk Netcaster Prototype
    name= _ "Wesfolk Netcaster Prototype"
    race=human
    image="units/wesfolk/faction/wesfolk-netcaster.png"
    hitpoints=29
    movement_type=elusivefoot
    movement=6
    experience=40
    level=1
    alignment=neutral
    advances_to=Wesfolk Champion Prototype
    cost=17
    usage=mixed fighter
    description= _ "Of the many styles experimented with by Wesfolk prizefighters, the spear and net draw the largest crowds. The shortspear is used up close, dancing in and out of reach to harry and tire an opponent. The weighed net can be thrown over an opponent to entangle them, or else used to catch their weapon and leave them defenseless. On a battlefield the net gains an additional use: it is an ideal tool to capture slaves or sacrifices for the Lich-Lords."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM  "units/wesfolk/faction/wesfolk-netcaster.png" "units/wesfolk/faction/wesfolk-netcaster.png" {SOUND_LIST:HUMAN_HIT} }
    [attack]
        name=spear
        description=_"spear"
        icon=attacks/spear.png
        type=pierce
        range=melee
        damage=6
        number=3
    [/attack]

    [attack]
        name=net
        description=_"net"
        icon=attacks/net.png
        type=impact
        range=ranged
        damage=5
        number=2
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        offset=0.0~0.2,0.2~0.6,0.6~0.4,0.4~0.0
        start_time=-300
        [frame]
            image="units/wesfolk/faction/wesfolk-netcaster.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=net
        [/filter_attack]
        missile_start_time=-200
        [missile_frame]
            duration=200
            image="projectiles/web.png"
            image_diagonal="projectiles/web.png"
        [/missile_frame]
        start_time=-200
        [frame]
            image="units/wesfolk/faction/wesfolk-netcaster.png:200"
        [/frame]
        {SOUND:HIT_AND_MISS net.wav {SOUND_LIST:MISS} -150}
    [/attack_anim]
[/unit_type]
