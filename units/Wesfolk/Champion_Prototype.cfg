#textdomain wesnoth-ctl
[unit_type]
    id=Wesfolk Champion Prototype
    name= _ "Wesfolk Champion Prototype"
    race=human
    image="units/wesfolk/faction/wesfolk-champion.png"
    hitpoints=46
    movement_type=elusivefoot
    movement=6
    experience=100
    level=2
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=28
    usage=mixed fighter
    description= _ "A successful net fighter will often save enough winnings to trade in his spear for the larger and flashier trident. A trident's length affords it great reach in melee, while its three points can bleed and weaken an opponent, preparing them to be netted and captured. Although accomplished in their trade, such prizefighters remain closer to performers than true soldiers, and have neither the opportunity nor the ambition for further advancement on the battlefield."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM  "units/wesfolk/faction/wesfolk-champion.png" "units/wesfolk/faction/wesfolk-champion.png" {SOUND_LIST:HUMAN_HIT} }
    [attack]
        name=trident
        description=_"trident"
        icon=attacks/trident.png
        type=pierce
        range=melee
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    [/attack]

    [attack]
        name=net
        description=_"net"
        icon=attacks/net.png
        type=impact
        range=ranged
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=trident
        [/filter_attack]
        offset=0.0~0.2,0.2~0.6,0.6~0.4,0.4~0.0
        start_time=-300
        [frame]
            image="units/wesfolk/faction/wesfolk-champion.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=net
        [/filter_attack]
        missile_start_time=-200
        [missile_frame]
            duration=200
            image="projectiles/web.png"
            image_diagonal="projectiles/web.png"
        [/missile_frame]
        start_time=-200
        [frame]
            image="units/wesfolk/faction/wesfolk-champion.png:200"
        [/frame]
        {SOUND:HIT_AND_MISS net.wav {SOUND_LIST:MISS} -150}
    [/attack_anim]
[/unit_type]
