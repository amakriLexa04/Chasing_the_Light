#textdomain wesnoth-ctl
[unit_type]
    id=Wesfolk Flagellant Prototype
    name= _ "Wesfolk Flagellant Prototype"
    race=human
    image="units/wesfolk/faction/wesfolk-flagellant.png"
    hitpoints=78
    movement_type=smallfoot
    movement=5
    experience=150
    level=3
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=71
    usage=fighter
    description= _ "The highest ranking whip users among the Wesfolk are the Flagellants. Notorious for the caustic poison that coats their barbed whips, these men and women commonly oversee regiments, guilds, academies, and prisons. Although their position is nominally that of a public servant, Flagellants have been known to take more pleasure in their duties than might be strictly necessary."
    die_sound={SOUND_LIST:HUMAN_DIE}
    [resistance]
        blade=90
        impact=80
        pierce=90
    [/resistance]
    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]
    {DEFENSE_ANIM  "units/wesfolk/faction/wesfolk-flagellant.png" "units/wesfolk/faction/wesfolk-flagellant.png" {SOUND_LIST:HUMAN_HIT} }
    [attack]
        name=cat-o-nine-tails
        description=_"cat-o’-nine-tails"
        icon=attacks/whip.png
        type=blade
        range=melee
        damage=6
        number=6
    [/attack]

    [attack]
        name=bash
        description=_"bash"
        icon=attacks/rectangular-shield.png
        type=impact
        range=melee
        damage=15
        number=2
        [specials]
            {WEAPON_SPECIAL_STUN}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=cat-o-nine-tails
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/wesfolk/faction/wesfolk-flagellant.png:[100,150,100]"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=bash
        [/filter_attack]
        offset=0.0~0.2,0.2~0.6,0.6~0.4,0.4~0.0
        start_time=-300
        [frame]
            image="units/wesfolk/faction/wesfolk-flagellant.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
[/unit_type]
