#textdomain wesnoth-ctl
[unit_type]
    id=Wesfolk Taskmaster Prototype
    name= _ "Wesfolk Taskmaster Prototype"
    race=human
    image="units/wesfolk/faction/wesfolk-taskmaster.png"
    hitpoints=59
    movement_type=smallfoot
    movement=5
    experience=80
    level=2
    alignment=neutral
    advances_to=Wesfolk Flagellant Prototype
    cost=33
    usage=fighter
    description= _ "Experienced Wesfolk whip users are often tasked with maintaining discipline among the ranks of their fellows. Although 'leadership' is not the right term to describe the actions of a Taskmaster, they prove similarly effective on the battlefield."
    die_sound={SOUND_LIST:HUMAN_DIE}
    [resistance]
        blade=90
        impact=80
        pierce=90
    [/resistance]
    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]
    {DEFENSE_ANIM  "units/wesfolk/faction/wesfolk-taskmaster.png" "units/wesfolk/faction/wesfolk-taskmaster.png" {SOUND_LIST:HUMAN_HIT} }
    [attack]
        name=whip
        description=_"whip"
        icon=attacks/whip.png
        type=blade
        range=melee
        damage=5
        number=5
    [/attack]

    [attack]
        name=bash
        description=_"bash"
        icon=attacks/rectangular-shield.png
        type=impact
        range=melee
        damage=10
        number=2
        [specials]
            {WEAPON_SPECIAL_STUN}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=whip
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/wesfolk/faction/wesfolk-taskmaster.png:[100,150,100]"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=bash
        [/filter_attack]
        offset=0.0~0.2,0.2~0.6,0.6~0.4,0.4~0.0
        start_time=-300
        [frame]
            image="units/wesfolk/faction/wesfolk-taskmaster.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
[/unit_type]
